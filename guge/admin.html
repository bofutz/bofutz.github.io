<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>波幅探长 · 管理后台</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- 抽离的统一自定义样式表 -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-slate-700 font-sans h-screen overflow-hidden select-none">
<div id="admin-app" v-cloak class="h-full flex flex-col">

  <!-- 安全登录验证弹窗 -->
  <div v-if="!isAuthenticated" class="fixed inset-0 z-50 bg-[#f4f6f8] flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200 text-center">
      <div class="w-16 h-16 theme-bg rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-shield-halved text-3xl text-white"></i></div>
      <h2 class="text-xl font-bold text-slate-800 mb-1">管理后台安全验证</h2>
      <p class="text-xs text-slate-400 mb-6">波幅探长 · Admin Console v2.2</p>
      <input v-model="adminSecret" @keyup.enter="login" type="password" placeholder="请输入 Admin-Secret"
        class="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-lg mb-4 text-center tracking-widest font-mono text-sm">
      <button @click="login" :disabled="loading" class="w-full theme-bg text-white font-medium py-2.5 rounded-lg hover:opacity-90 disabled:opacity-50 flex justify-center items-center">
        <i v-if="loading" class="fa-solid fa-spinner animate-spin mr-2"></i> 登 录
      </button>
      <p v-if="errorMsg" class="text-red-500 text-xs mt-3">{{ errorMsg }}</p>
    </div>
  </div>

  <template v-else>
    <!-- 通用 Header -->
    <header class="bg-white border-b border-slate-200 h-14 sm:h-16 shrink-0 flex items-center justify-between px-4 sm:px-6 z-20">
      <div class="flex items-center gap-3">
        <button @click="sidebarOpen=!sidebarOpen" class="sm:hidden text-slate-500 p-1.5"><i class="fa-solid fa-bars text-lg"></i></button>
        <img src="logo.png" class="w-7 h-7 rounded-lg object-cover border border-slate-100" onerror="this.style.display='none'">
        <h1 class="text-base sm:text-lg font-bold text-slate-800">波幅探长 <span class="text-[10px] sm:text-xs text-slate-400 font-normal ml-1 bg-slate-100 px-2 py-0.5 rounded">管理后台</span></h1>
      </div>
      <div class="flex items-center gap-3">
        <button @click="refreshAll" class="text-slate-400 hover:theme-text text-sm hidden sm:inline-flex items-center gap-1"><i class="fa-solid fa-rotate-right" :class="{'animate-spin':loading}"></i><span class="text-xs">刷新</span></button>
        <button @click="logout" class="text-sm text-slate-500 hover:text-red-500"><i class="fa-solid fa-power-off mr-1"></i><span class="hidden sm:inline">退出</span></button>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
      <div v-if="sidebarOpen" @click="sidebarOpen=false" class="fixed inset-0 bg-black/40 z-30 sm:hidden"></div>
      
      <!-- 通用 Left Sidebar 左侧导航 -->
      <aside class="fixed sm:static inset-y-0 left-0 w-56 bg-white border-r border-slate-200 flex flex-col py-4 z-40 shadow-lg sm:shadow-sm shrink-0 transition-transform duration-300"
        :class="sidebarOpen?'translate-x-0':'-translate-x-full sm:translate-x-0'">
        <nav class="flex-1 space-y-0.5 overflow-y-auto custom-scrollbar">
          <div @click="switchTab('dashboard')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='dashboard'}"><i class="fa-solid fa-chart-pie"></i>数据概览</div>
          <div @click="switchTab('users')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='users'}"><i class="fa-solid fa-users"></i>用户管理</div>
          <div @click="switchTab('orders')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='orders'}"><i class="fa-solid fa-file-invoice-dollar"></i>订单审核
            <span v-if="pendingOrdersCount" class="ml-auto bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold badge-pulse">{{pendingOrdersCount}}</span>
          </div>
          <div @click="switchTab('plans')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='plans'}"><i class="fa-solid fa-tags"></i>套餐管理</div>
          <div @click="switchTab('shared')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='shared'}"><i class="fa-solid fa-list"></i>通用监控</div>
          <div @click="switchTab('custom')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='custom'}"><i class="fa-solid fa-user-tag"></i>定制监控</div>
          <div @click="switchTab('votes')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='votes'}"><i class="fa-solid fa-check-to-slot"></i>监控投票
            <span v-if="voteTotalCount" class="ml-auto bg-teal-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">{{voteTotalCount}}</span>
          </div>
          <div @click="switchTab('promos')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='promos'}"><i class="fa-solid fa-percent"></i>优惠码</div>
          <div @click="switchTab('settings')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='settings'}"><i class="fa-solid fa-gear"></i>系统设置</div>
          <div @click="switchTab('tickets')" class="nav-item flex items-center px-6 py-2.5" :class="{active:currentTab==='tickets'}"><i class="fa-solid fa-headset"></i>答疑工单
            <span v-if="pendingTicketsCount" class="ml-auto bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">{{pendingTicketsCount}}</span>
          </div>
        </nav>
      </aside>

      <!-- 右侧主内容区 -->
      <main class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 bg-slate-50/50">
        <div v-if="loading && isInitialLoad" class="h-full flex flex-col items-center justify-center text-slate-400">
          <i class="fa-solid fa-circle-notch animate-spin text-3xl mb-3 theme-text"></i><p class="text-sm">读取云端数据中...</p>
        </div>
        <div v-else class="max-w-7xl mx-auto space-y-4">

          <!-- 模块 1：数据概览 -->
          <div v-show="currentTab==='dashboard'" class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <h2 class="text-xl font-bold text-slate-800">运营数据概览</h2>
              <span class="text-xs text-slate-400">近 7 日新用户 {{stats.new_users_7d||0}} · 营收 ¥{{Number(stats.revenue_7d||0).toFixed(2)}}</span>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div class="bg-white rounded-xl border border-slate-100 p-4 shadow-sm">
                <div class="text-xs text-slate-400 mb-1">注册用户</div>
                <div class="text-2xl font-bold">{{stats.users||0}}</div>
                <div class="text-[11px] text-emerald-600 mt-1">通用VIP {{stats.vip_users||0}}</div>
              </div>
              <div class="bg-white rounded-xl border border-slate-100 p-4 shadow-sm">
                <div class="text-xs text-slate-400 mb-1">待审订单</div>
                <div class="text-2xl font-bold" :class="(stats.orders_pending||0)>0?'text-orange-500':''">{{stats.orders_pending||0}}</div>
                <div class="text-[11px] text-slate-400 mt-1">累计营收 ¥{{Number(stats.revenue||0).toFixed(2)}}</div>
              </div>
              <div class="bg-white rounded-xl border border-slate-100 p-4 shadow-sm">
                <div class="text-xs text-slate-400 mb-1">监控标的</div>
                <div class="text-2xl font-bold">{{stats.shared_count||0}}</div>
                <div class="text-[11px] text-slate-400 mt-1">定制活跃 {{stats.custom_active||0}}</div>
              </div>
              <div class="bg-white rounded-xl border border-slate-100 p-4 shadow-sm">
                <div class="text-xs text-slate-400 mb-1">本月投票数</div>
                <div class="text-2xl font-bold text-teal-600">{{stats.vote_total||0}}</div>
                <div class="text-[11px] text-slate-400 mt-1">参与会员 {{stats.vote_voters||0}} 人</div>
              </div>
            </div>
            <div class="bg-white rounded-xl border border-slate-100 p-5 shadow-sm">
              <div class="text-sm font-medium text-slate-700 mb-3">快捷操作</div>
              <div class="flex flex-wrap gap-2">
                <button @click="switchTab('orders')" class="text-xs theme-bg text-white px-3 py-2 rounded-lg">审核订单 <span v-if="stats.orders_pending" class="bg-white/20 px-1.5 rounded">{{stats.orders_pending}}</span></button>
                <button @click="switchTab('votes')" class="text-xs bg-teal-50 text-teal-700 border border-teal-100 px-3 py-2 rounded-lg">查看投票排行</button>
                <button @click="switchTab('tickets')" class="text-xs bg-orange-50 text-orange-600 border border-orange-100 px-3 py-2 rounded-lg">处理工单</button>
                <button @click="openBroadcast" class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-100 px-3 py-2 rounded-lg">一键广播</button>
                <button @click="switchTab('shared')" class="text-xs bg-slate-100 px-3 py-2 rounded-lg">编辑通用列表</button>
                <button @click="switchTab('settings')" class="text-xs bg-slate-100 px-3 py-2 rounded-lg">系统设置</button>
              </div>
            </div>
          </div>

          <!-- 模块 2：用户管理 -->
          <div v-show="currentTab==='users'" class="space-y-4">
            <div class="flex flex-col sm:flex-row justify-between gap-3">
              <div><h2 class="text-xl font-bold">用户管理</h2><p class="text-xs text-slate-400">充天数 · 重置密码 · 删除均需谨慎操作</p></div>
              <div class="flex flex-wrap gap-2">
                <input v-model="userSearchQuery" placeholder="搜索邮箱/邀请码/IP" class="px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white sm:w-48">
                <button @click="openBatchCharge" class="text-sm bg-emerald-50 text-emerald-600 border border-emerald-100 px-3 py-2 rounded-lg">批量充天数</button>
                <button @click="fetchUsers" class="text-sm bg-white border border-slate-200 px-3 py-2 rounded-lg"><i class="fa-solid fa-rotate-right"></i></button>
              </div>
            </div>
            <div class="bg-white border border-slate-100 rounded-xl overflow-hidden shadow-sm">
              <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-sm whitespace-nowrap">
                  <thead class="bg-slate-50 text-slate-500 border-b">
                    <tr>
                      <th class="py-3 px-3 w-8"><input type="checkbox" @change="toggleSelectAllUsers" :checked="selectedUserIds.length&&selectedUserIds.length===filteredUsers.length"></th>
                      <th class="py-3 px-4 text-left">ID/时间</th>
                      <th class="py-3 px-4 text-left">账号</th>
                      <th class="py-3 px-4 text-left">IP</th>
                      <th class="py-3 px-4 text-left">通用VIP</th>
                      <th class="py-3 px-4 text-left">邀请码</th>
                      <th class="py-3 px-4 text-right">操作</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50">
                    <tr v-for="u in filteredUsers" :key="u.id" class="hover:bg-slate-50">
                      <td class="px-3"><input type="checkbox" :value="u.id" v-model="selectedUserIds"></td>
                      <td class="py-3 px-4 text-xs text-slate-400">{{u.id}}<br>{{formatDate(u.created_at)}}</td>
                      <td class="py-3 px-4 font-bold">{{u.username}}<div v-if="u.referred_by||u.ref_by" class="text-[10px] text-slate-400">邀请: {{u.referred_by||u.ref_by}}</div></td>
                      <td class="py-3 px-4 font-mono text-xs">{{u.ip||u.register_ip||'-'}}</td>
                      <td class="py-3 px-4" :class="(u.shared_vip_days||u.vip_days_left)>0?'text-emerald-500 font-bold':'text-slate-400'">{{u.shared_vip_days??u.vip_days_left??0}} 天</td>
                      <td class="py-3 px-4 font-mono text-xs font-bold">{{u.referral_code||'-'}}</td>
                      <td class="py-3 px-4 text-right space-x-1">
                        <button @click="openChargeModal(u)" class="text-xs bg-emerald-50 text-emerald-600 px-2 py-1 rounded border border-emerald-100">充天数</button>
                        <button @click="openResetPwd(u)" class="text-xs bg-amber-50 text-amber-600 px-2 py-1 rounded border border-amber-100">重置密码</button>
                        <button @click="openDeleteUser(u)" class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded border border-red-100">删除</button>
                      </td>
                    </tr>
                    <tr v-if="!filteredUsers.length"><td colspan="7" class="py-10 text-center text-slate-400">暂无用户</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 模块 3：订单审核 -->
          <div v-show="currentTab==='orders'" class="space-y-4">
            <div class="flex flex-col sm:flex-row justify-between gap-3">
              <h2 class="text-xl font-bold">订单审核</h2>
              <div class="flex gap-2 flex-wrap">
                <div class="flex bg-white border rounded-lg overflow-hidden text-xs">
                  <button v-for="s in [{k:'all',t:'全部'},{k:'pending',t:'待审'},{k:'approved',t:'已通过'},{k:'cancelled',t:'已驳回'}]" :key="s.k"
                    @click="orderStatusFilter=s.k" class="px-3 py-2 border-l first:border-0"
                    :class="orderStatusFilter===s.k?'theme-bg text-white':'text-slate-600'">{{s.t}}</button>
                </div>
                <input v-model="orderSearchQuery" placeholder="账号/单号" class="px-3 py-2 border rounded-lg text-sm bg-white">
                <button @click="fetchOrders" class="bg-white border px-3 py-2 rounded-lg text-sm"><i class="fa-solid fa-rotate-right"></i></button>
              </div>
            </div>
            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
              <div class="overflow-x-auto">
                <table class="w-full text-sm whitespace-nowrap">
                  <thead class="bg-slate-50 text-slate-500 border-b"><tr>
                    <th class="py-3 px-4 text-left">时间</th><th class="py-3 px-4 text-left">用户</th><th class="py-3 px-4 text-left">类型/套餐</th>
                    <th class="py-3 px-4 text-left">金额</th><th class="py-3 px-4 text-left text-orange-500">凭证</th>
                    <th class="py-3 px-4 text-left">发放</th><th class="py-3 px-4 text-left">状态</th><th class="py-3 px-4 text-right">操作</th>
                  </tr></thead>
                  <tbody class="divide-y">
                    <tr v-for="o in filteredOrders" :key="o.id" class="hover:bg-slate-50">
                      <td class="py-3 px-4 text-xs text-slate-400">{{formatDate(o.created_at)}}</td>
                      <td class="py-3 px-4 font-bold">{{o.username||o.register_username||'-'}}</td>
                      <td class="py-3 px-4">
                        <span class="bg-slate-100 px-2 py-0.5 rounded text-xs">{{getPlanName(o.plan_id)}}</span>
                        <span class="text-[10px] ml-1" :class="o.order_type==='custom_watchlist'?'text-purple-500':'text-slate-400'">{{o.order_type==='custom_watchlist'?'定制':'通用'}}</span>
                      </td>
                      <td class="py-3 px-4 font-bold">¥{{Number(o.amount||0).toFixed(2)}}</td>
                      <td class="py-3 px-4 font-mono font-bold text-orange-500">{{o.tx_id_last6||'-'}}</td>
                      <td class="py-3 px-4 text-xs">{{o.status==='approved'?(o.vip_days_granted?('+'+o.vip_days_granted+'天'):'定制激活'):'-'}}</td>
                      <td class="py-3 px-4">
                        <span v-if="o.status==='pending'" class="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full">待审核</span>
                        <span v-else-if="o.status==='approved'" class="text-xs bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-full">已通过</span>
                        <span v-else class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">已驳回</span>
                      </td>
                      <td class="py-3 px-4 text-right space-x-1" v-if="o.status==='pending'">
                        <button @click="approveOrder(o)" class="theme-bg text-white text-xs px-3 py-1 rounded-lg">通过</button>
                        <button @click="rejectOrder(o)" class="bg-slate-100 text-xs px-3 py-1 rounded-lg">驳回</button>
                      </td>
                      <td v-else class="py-3 px-4 text-right text-slate-300 text-xs">—</td>
                    </tr>
                    <tr v-if="!filteredOrders.length"><td colspan="8" class="py-10 text-center text-slate-400">暂无订单</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 模块 4：套餐管理 -->
          <div v-show="currentTab==='plans'" class="space-y-4">
            <div class="flex flex-col sm:flex-row justify-between gap-3">
              <div>
                <h2 class="text-xl font-bold">套餐管理</h2>
                <p class="text-xs text-slate-400">月度以上套餐自动享有监控投票权。</p>
              </div>
              <button @click="openPlanModal()" class="theme-bg text-white text-sm px-3 py-2 rounded-lg">新增套餐</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              <div v-for="p in plans" :key="p.id" class="bg-white border rounded-xl p-4 shadow-sm relative">
                <span v-if="p.tag" class="absolute top-0 right-0 bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded-bl">{{p.tag}}</span>
                <div class="font-bold text-slate-800">{{p.name}}</div>
                <div class="text-2xl font-light mt-1">¥{{p.price}}</div>
                <div class="text-xs text-slate-400 mt-1">{{p.days}} 天 · {{(p.plan_type||'shared')==='custom'?'定制':'通用'}}</div>
                <div class="mt-3 flex gap-2">
                  <button @click="openPlanModal(p)" class="text-xs bg-slate-100 px-2 py-1 rounded">编辑</button>
                  <button @click="deletePlan(p)" class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded">删除</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 模块 5：通用监控 -->
          <div v-show="currentTab==='shared'" class="space-y-4">
            <div class="flex justify-between gap-3">
              <h2 class="text-xl font-bold">通用监控列表</h2>
              <div class="flex gap-2">
                <button @click="showBatchImport=true" class="text-sm bg-slate-100 px-3 py-2 rounded-lg">批量导入</button>
                <button @click="openSharedModal()" class="theme-bg text-white text-sm px-3 py-2 rounded-lg">添加标的</button>
              </div>
            </div>
            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-500 border-b"><tr>
                  <th class="py-3 px-4 text-left">代码</th><th class="py-3 px-4 text-left">名称</th>
                  <th class="py-3 px-4 text-left">排序</th><th class="py-3 px-4 text-left">状态</th><th class="py-3 px-4 text-right">操作</th>
                </tr></thead>
                <tbody class="divide-y">
                  <tr v-for="w in sharedList" :key="w.id" class="hover:bg-slate-50">
                    <td class="py-3 px-4 font-mono font-bold">{{w.etf_code}}</td>
                    <td class="py-3 px-4">{{w.etf_name}}</td>
                    <td class="py-3 px-4">{{w.sort_order||0}}</td>
                    <td class="py-3 px-4"><span :class="w.enabled?'text-emerald-500':'text-slate-400'">{{w.enabled?'启用':'停用'}}</span></td>
                    <td class="py-3 px-4 text-right space-x-1">
                      <button @click="openSharedModal(w)" class="text-xs bg-slate-100 px-2 py-1 rounded">编辑</button>
                      <button @click="deleteShared(w)" class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded">删除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 模块 6：定制监控 -->
          <div v-show="currentTab==='custom'" class="space-y-4">
            <div class="flex justify-between gap-3">
              <h2 class="text-xl font-bold">定制监控列表</h2>
              <button @click="fetchCustom" class="bg-white border px-3 py-2 rounded-lg text-sm"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
              <table class="w-full text-sm whitespace-nowrap">
                <thead class="bg-slate-50 text-slate-500 border-b"><tr>
                  <th class="py-3 px-4 text-left">用户</th><th class="py-3 px-4 text-left">代码/名称</th>
                  <th class="py-3 px-4 text-left">状态</th><th class="py-3 px-4 text-left">到期</th><th class="py-3 px-4 text-right">操作</th>
                </tr></thead>
                <tbody class="divide-y">
                  <tr v-for="w in customList" :key="w.id" class="hover:bg-slate-50">
                    <td class="py-3 px-4">{{w.username||w.user_id}}</td>
                    <td class="py-3 px-4"><span class="font-mono font-bold">{{w.etf_code}}</span> <span class="text-xs text-slate-400">{{w.etf_name}}</span></td>
                    <td class="py-3 px-4"><span :class="w.status==='active'?'text-emerald-500':'text-slate-400'">{{w.status}}</span></td>
                    <td class="py-3 px-4 text-xs text-slate-400">{{w.expire_at?formatDate(w.expire_at):'-'}}</td>
                    <td class="py-3 px-4 text-right space-x-1">
                      <button @click="openCustomEdit(w)" class="text-xs bg-slate-100 px-2 py-1 rounded">编辑</button>
                      <button @click="deleteCustom(w)" class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded">删除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 模块 7：监控投票管理（全新补充模块） -->
          <div v-show="currentTab==='votes'" class="space-y-4">
            <div class="flex flex-col sm:flex-row justify-between gap-3">
              <div>
                <h2 class="text-xl font-bold">会员监控投票管理</h2>
                <p class="text-xs text-slate-400">统计全网会员投票结果，前台按票数实时倒序展示前 Top {{ settingsForm.vote_display_top_n || 100 }} 标的。</p>
              </div>
              <div class="flex gap-2">
                <button @click="clearMonthlyVotes" class="text-sm bg-red-50 text-red-600 border border-red-100 px-3 py-2 rounded-lg"><i class="fa-solid fa-trash-can mr-1"></i>清空本月投票</button>
                <button @click="fetchVotes" class="bg-white border px-3 py-2 rounded-lg text-sm"><i class="fa-solid fa-rotate-right"></i></button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-400">已收到有效投票标的数量</div>
                <div class="text-2xl font-bold mt-1 text-slate-800">{{ voteAdminList.length }}</div>
              </div>
              <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-400">累计投票总人次</div>
                <div class="text-2xl font-bold mt-1 text-teal-600">{{ totalVotesSum }}</div>
              </div>
              <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-400">每人月度投票上限</div>
                <div class="text-2xl font-bold mt-1 text-amber-600">{{ settingsForm.vote_max_per_user || 10 }} 只</div>
              </div>
            </div>

            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
              <div class="overflow-x-auto">
                <table class="w-full text-sm whitespace-nowrap">
                  <thead class="bg-slate-50 text-slate-500 border-b">
                    <tr>
                      <th class="py-3 px-4 text-center w-16">排名</th>
                      <th class="py-3 px-4 text-left">标的代码</th>
                      <th class="py-3 px-4 text-left">标的名称</th>
                      <th class="py-3 px-4 text-center">得票数</th>
                      <th class="py-3 px-4 text-center">投票会员数</th>
                      <th class="py-3 px-4 text-right">操作</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50">
                    <tr v-for="(v, index) in voteAdminList" :key="v.etf_code" class="hover:bg-slate-50">
                      <td class="py-3 px-4 text-center font-mono font-bold text-slate-400">{{ index + 1 }}</td>
                      <td class="py-3 px-4 font-mono font-bold theme-text">{{ v.etf_code }}</td>
                      <td class="py-3 px-4 font-medium">{{ v.etf_name || '-' }}</td>
                      <td class="py-3 px-4 text-center font-bold text-orange-500">{{ v.vote_count }}</td>
                      <td class="py-3 px-4 text-center text-xs text-slate-500">{{ v.voters_count || v.vote_count }} 人</td>
                      <td class="py-3 px-4 text-right">
                        <button @click="deleteVoteItem(v.etf_code)" class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded">清除票数</button>
                      </td>
                    </tr>
                    <tr v-if="!voteAdminList.length"><td colspan="6" class="py-10 text-center text-slate-400">暂无投票记录</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 模块 8：优惠码 -->
          <div v-show="currentTab==='promos'" class="space-y-4">
            <div class="flex justify-between gap-3">
              <h2 class="text-xl font-bold">优惠码</h2>
              <button @click="openPromoModal()" class="theme-bg text-white text-sm px-3 py-2 rounded-lg">新增</button>
            </div>
            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-500 border-b"><tr>
                  <th class="py-3 px-4 text-left">代码</th><th class="py-3 px-4 text-left">折扣</th>
                  <th class="py-3 px-4 text-left">状态</th><th class="py-3 px-4 text-right">操作</th>
                </tr></thead>
                <tbody class="divide-y">
                  <tr v-for="p in promos" :key="p.id" class="hover:bg-slate-50">
                    <td class="py-3 px-4 font-mono font-bold">{{p.code}}</td>
                    <td class="py-3 px-4">{{p.discount_type==='percent'? (p.discount_value+'%') : ('¥'+p.discount_value)}}</td>
                    <td class="py-3 px-4"><span :class="p.enabled?'text-emerald-500':'text-slate-400'">{{p.enabled?'启用':'停用'}}</span></td>
                    <td class="py-3 px-4 text-right space-x-1">
                      <button @click="openPromoModal(p)" class="text-xs bg-slate-100 px-2 py-1 rounded">编辑</button>
                      <button @click="deletePromo(p)" class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded">删除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 模块 9：系统设置（集成监控投票配置） -->
          <div v-show="currentTab==='settings'" class="space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-xl font-bold">系统设置</h2>
              <button @click="saveSettings" class="theme-bg text-white text-sm px-4 py-2 rounded-lg">保存设置</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <!-- 基础配置 -->
              <div class="bg-white rounded-xl border p-5 space-y-3">
                <div class="text-sm font-medium text-slate-700">注册 / 邀请赠送天数</div>
                <div class="grid grid-cols-3 gap-3">
                  <div>
                    <label class="text-xs text-slate-500 mb-1 block">注册赠送</label>
                    <input type="number" v-model.number="settingsForm.gift_register_days" class="w-full border px-3 py-2 rounded-lg text-sm">
                  </div>
                  <div>
                    <label class="text-xs text-slate-500 mb-1 block">邀请人赠送</label>
                    <input type="number" v-model.number="settingsForm.gift_inviter_days" class="w-full border px-3 py-2 rounded-lg text-sm">
                  </div>
                  <div>
                    <label class="text-xs text-slate-500 mb-1 block">被邀请人额外</label>
                    <input type="number" v-model.number="settingsForm.gift_invitee_days" class="w-full border px-3 py-2 rounded-lg text-sm">
                  </div>
                </div>
              </div>

              <!-- 监控投票参数设置（新增） -->
              <div class="bg-white rounded-xl border p-5 space-y-3">
                <div class="text-sm font-medium text-slate-700">监控投票功能设置</div>
                <div class="grid grid-cols-3 gap-3">
                  <div>
                    <label class="text-xs text-slate-500 mb-1 block">会员每月投票上限</label>
                    <input type="number" v-model.number="settingsForm.vote_max_per_user" min="1" max="50" class="w-full border px-3 py-2 rounded-lg text-sm">
                  </div>
                  <div>
                    <label class="text-xs text-slate-500 mb-1 block">首页展示 Top N</label>
                    <input type="number" v-model.number="settingsForm.vote_display_top_n" min="10" max="500" class="w-full border px-3 py-2 rounded-lg text-sm">
                  </div>
                  <div>
                    <label class="text-xs text-slate-500 mb-1 block">投票要求最小天数</label>
                    <input type="number" v-model.number="settingsForm.vote_min_plan_days" min="1" class="w-full border px-3 py-2 rounded-lg text-sm">
                  </div>
                </div>
                <p class="text-[11px] text-slate-400">注：购买月度（≥30天）及以上套餐会员自动具备投票资格。</p>
              </div>

              <!-- 收款码设置 -->
              <div class="bg-white rounded-xl border p-5 space-y-3">
                <div class="text-sm font-medium text-slate-700">收款码链接/图片 URL</div>
                <div class="space-y-2">
                  <input v-model="settingsForm.alipay_qr_url" placeholder="支付宝收款码 URL" class="w-full border px-3 py-2 rounded-lg text-sm">
                  <input v-model="settingsForm.wechat_qr_url" placeholder="微信收款码 URL" class="w-full border px-3 py-2 rounded-lg text-sm">
                </div>
              </div>

              <!-- 社交链接 -->
              <div class="bg-white rounded-xl border p-5 space-y-3">
                <div class="text-sm font-medium text-slate-700">Footer 社交主页链接</div>
                <div class="grid grid-cols-2 gap-2">
                  <input v-model="settingsForm.social_douyin" placeholder="抖音链接" class="border px-3 py-2 rounded-lg text-sm">
                  <input v-model="settingsForm.social_shipinhao" placeholder="视频号链接" class="border px-3 py-2 rounded-lg text-sm">
                  <input v-model="settingsForm.social_xiaohongshu" placeholder="小红书链接" class="border px-3 py-2 rounded-lg text-sm">
                  <input v-model="settingsForm.social_gongzhonghao" placeholder="公众号链接" class="border px-3 py-2 rounded-lg text-sm">
                </div>
              </div>
            </div>
          </div>

          <!-- 模块 10：答疑工单 -->
          <div v-show="currentTab==='tickets'" class="space-y-4">
            <div class="flex justify-between gap-3">
              <h2 class="text-xl font-bold">答疑工单</h2>
              <button @click="openBroadcast" class="text-sm bg-indigo-50 text-indigo-600 border border-indigo-100 px-3 py-2 rounded-lg">一键广播</button>
            </div>
            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-500 border-b"><tr>
                  <th class="py-3 px-4 text-left">时间</th><th class="py-3 px-4 text-left">用户</th><th class="py-3 px-4 text-left">主题</th>
                  <th class="py-3 px-4 text-left">状态</th><th class="py-3 px-4 text-right">操作</th>
                </tr></thead>
                <tbody class="divide-y">
                  <tr v-for="t in tickets" :key="t.id" class="hover:bg-slate-50">
                    <td class="py-3 px-4 text-xs text-slate-400">{{formatDate(t.created_at)}}</td>
                    <td class="py-3 px-4 font-bold">{{t.username||'-'}}</td>
                    <td class="py-3 px-4">{{t.subject}}</td>
                    <td class="py-3 px-4"><span :class="t.status==='pending'?'text-orange-500':'text-emerald-500'">{{t.status==='pending'?'待回复':'已回复'}}</span></td>
                    <td class="py-3 px-4 text-right">
                      <button @click="openReplyModal(t)" class="text-xs theme-bg text-white px-3 py-1 rounded-lg">回复</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
  </template>

  <!-- 全局 Toast -->
  <div class="fixed top-4 right-4 z-[200] space-y-2">
    <div v-for="(t,i) in toasts" :key="i" class="toast-enter px-4 py-2 rounded-lg shadow text-sm text-white" :class="t.type==='error'?'bg-red-500':'bg-emerald-500'">{{t.msg}}</div>
  </div>

  <!-- 充天数弹窗 -->
  <div v-if="chargeModalVisible" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4" @click.self="chargeModalVisible=false">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-3">
      <h3 class="font-bold">充天数 · {{chargeTarget?.username}}</h3>
      <input type="number" v-model.number="chargeDays" class="w-full border px-3 py-2 rounded-lg text-sm" placeholder="天数">
      <div class="flex justify-end gap-2">
        <button @click="chargeModalVisible=false" class="px-4 py-2 text-sm text-slate-500">取消</button>
        <button @click="submitCharge" class="theme-bg text-white px-4 py-2 rounded-lg text-sm">确认</button>
      </div>
    </div>
  </div>

  <!-- 批量充天数弹窗 -->
  <div v-if="batchChargeVisible" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4" @click.self="batchChargeVisible=false">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-3">
      <h3 class="font-bold">批量充天数（{{selectedUserIds.length}} 人）</h3>
      <input type="number" v-model.number="batchDays" class="w-full border px-3 py-2 rounded-lg text-sm">
      <div class="flex justify-end gap-2">
        <button @click="batchChargeVisible=false" class="px-4 py-2 text-sm text-slate-500">取消</button>
        <button @click="submitBatchCharge" class="theme-bg text-white px-4 py-2 rounded-lg text-sm">确认</button>
      </div>
    </div>
  </div>

  <!-- 重置密码弹窗 -->
  <div v-if="resetPwdVisible" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4" @click.self="resetPwdVisible=false">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-3">
      <h3 class="font-bold text-amber-600">重置密码 · {{resetTarget?.username}}</h3>
      <input type="password" v-model="resetConfirmSecret" class="w-full border px-3 py-2 rounded-lg text-sm" placeholder="Admin-Secret">
      <div class="flex justify-end gap-2">
        <button @click="resetPwdVisible=false" class="px-4 py-2 text-sm text-slate-500">取消</button>
        <button @click="submitResetPwd" class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm">确认重置</button>
      </div>
    </div>
  </div>

  <!-- 删除用户弹窗 -->
  <div v-if="deleteUserVisible" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4" @click.self="deleteUserVisible=false">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-3">
      <h3 class="font-bold text-red-600">删除用户 · {{deleteTarget?.username}}</h3>
      <input type="password" v-model="deleteConfirmSecret" class="w-full border px-3 py-2 rounded-lg text-sm" placeholder="Admin-Secret">
      <div class="flex justify-end gap-2">
        <button @click="deleteUserVisible=false" class="px-4 py-2 text-sm text-slate-500">取消</button>
        <button @click="submitDeleteUser" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm">确认删除</button>
      </div>
    </div>
  </div>

  <!-- 回复工单弹窗 -->
  <div v-if="replyModalVisible" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4" @click.self="replyModalVisible=false">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-3">
      <h3 class="font-bold">回复工单 · {{currentTicket?.subject}}</h3>
      <textarea v-model="replyMessage" rows="4" class="w-full border px-3 py-2 rounded-lg text-sm" placeholder="回复内容..."></textarea>
      <div class="flex justify-end gap-2">
        <button @click="replyModalVisible=false" class="px-4 py-2 text-sm text-slate-500">取消</button>
        <button @click="submitReply" class="theme-bg text-white px-4 py-2 rounded-lg text-sm">发送</button>
      </div>
    </div>
  </div>

  <!-- 一键广播弹窗 -->
  <div v-if="broadcastVisible" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4" @click.self="broadcastVisible=false">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-3">
      <h3 class="font-bold"><i class="fa-solid fa-bullhorn mr-1 text-indigo-500"></i>一键广播给全体会员</h3>
      <input v-model="broadcastForm.title" placeholder="标题" class="w-full border px-3 py-2 rounded-lg text-sm">
      <textarea v-model="broadcastForm.content" rows="5" placeholder="内容..." class="w-full border px-3 py-2 rounded-lg text-sm"></textarea>
      <div class="flex justify-end gap-2">
        <button @click="broadcastVisible=false" class="px-4 py-2 text-sm text-slate-500">取消</button>
        <button @click="submitBroadcast" :disabled="broadcastLoading" class="bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm disabled:opacity-50">确认广播</button>
      </div>
    </div>
  </div>

</div>

<!-- 脚本引入分类文件 -->
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
