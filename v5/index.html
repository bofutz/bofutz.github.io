<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>波幅探长 - 股票/ETF波幅异动批量监控</title>
  <meta name="description" content="波幅探长：股票/ETF波幅异动批量监控。注册即可免费查看全量数据与图表。" />
  <link rel="icon" type="image/png" href="./webpic/logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

  <style>
    [v-cloak] { display: none !important; }
    :root { --theme: #4da6a0; --theme-dark: #3d8a85; }
    .theme-bg { background-color: var(--theme); }
    .theme-text { color: var(--theme); }
    .theme-border { border-color: var(--theme); }
    .focus\:theme-border:focus { border-color: var(--theme); box-shadow: 0 0 0 2px rgba(77, 166, 160, 0.15); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7f9;
      min-height: 100dvh;
    }
    .modal-overlay { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(3px); }
    .custom-scrollbar::-webkit-scrollbar { height: 5px; width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .etf-name-column { min-width: 155px; max-width: 210px; }
    @media (min-width: 640px) {
      .etf-name-column { min-width: 200px; max-width: 260px; }
    }
    .dash-board-table {
      table-layout: fixed; width: 100%; min-width: 100%;
      border-collapse: separate; border-spacing: 0;
    }
    .dash-board-table .dash-col-name { width: 25%; min-width: 165px; }
    .dash-board-table .dash-col-day,
    .dash-board-table .dash-col-week {
      width: 12.5%; box-sizing: border-box; padding-left: 0.2rem; padding-right: 0.2rem;
    }
    .dash-board-table .dash-cell-inner { min-height: 2.25rem; }
    @media (max-width: 640px) {
      .dash-board-table { table-layout: auto; width: max-content; min-width: 100%; }
      .dash-board-table .dash-col-name { width: 9.25rem; min-width: 9.25rem; max-width: 10.25rem; }
      .dash-board-table .dash-col-day { min-width: 4.35rem; width: 4.35rem; }
      .dash-board-table .dash-col-week { min-width: 3.6rem; width: 3.6rem; }
      .dash-board-table .dash-cell-inner { min-height: 2.65rem; }
    }
    .dash-table-scroll { -webkit-overflow-scrolling: touch; width: 100%; }
    .dash-board-table .dash-col-name,
    .dash-board-table th.etf-name-column,
    .dash-board-table td.etf-name-column {
      position: sticky; left: 0; z-index: 20; background: #fff;
    }
    .dash-board-table thead th.etf-name-column,
    .dash-board-table thead th.dash-col-name {
      z-index: 50; background: #f8fafc;
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="app" v-cloak class="min-h-[100dvh] flex flex-col">
    <app-header></app-header>
    <main class="flex-1 w-full px-2.5 sm:px-4 py-3 sm:py-6">
      <component :is="currentView"></component>
    </main>
    <app-footer></app-footer>
    <auth-modal></auth-modal>
    <toast-stack></toast-stack>
    <ads-popup></ads-popup>
  </div>

  <script type="module">
    import { store } from "./js/store.js";
    import { authApi } from "./js/api/auth.js";

    import Header from "./js/components/common/Header.js";
    import Footer from "./js/components/common/Footer.js";
    import AuthModal from "./js/components/common/AuthModal.js";
    import Toast from "./js/components/common/Toast.js";
    import AdsPopup from "./js/components/common/AdsPopup.js";

    import Dashboard from "./js/components/index/Dashboard.js";
    import Profile from "./js/components/index/Profile.js";
    import Tickets from "./js/components/index/Tickets.js";
    import Guide from "./js/components/index/Guide.js";
    import Sponsor from "./js/components/index/Sponsor.js";

    const { createApp, ref, computed, onMounted, watch } = Vue;

    const routes = {
      "/": "dashboard-view",
      "/profile": "profile-view",
      "/tickets": "tickets-view",
      "/guide": "guide-view",
      "/sponsor": "sponsor-view",
    };

    function parseHash() {
      const raw = (window.location.hash || "#/").replace(/^#/, "") || "/";
      const path = raw.split("?")[0] || "/";
      return routes[path] ? path : "/";
    }

    const app = createApp({
      setup() {
        const routePath = ref(parseHash());
        const currentView = computed(() => routes[routePath.value] || "dashboard-view");

        const syncRoute = () => {
          routePath.value = parseHash();
          store.state.menuOpen = false;
          store.state.userMenuOpen = false;
          window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
        };

        const refreshMe = async () => {
          if (!store.state.isLoggedIn) return;
          try {
            const res = await authApi.getMe();
            const d = res?.data || res;
            if (!d) return;
            store.setUserState({
              userId: d.id,
              username: d.username,
              nickname: d.nickname || "",
              securitySet: d.security_set,
            });
          } catch (e) {
            if (String(e.message || "").includes("401") || e.status === 401) {
              store.clearUserState();
            }
          }
        };

        onMounted(async () => {
          store.checkLoginState();
          await store.loadPublicSettings();
          await refreshMe();
          window.addEventListener("hashchange", syncRoute);
        });

        watch(() => store.state.isLoggedIn, (v) => { if (v) refreshMe(); });

        return { currentView, store: store.state };
      },
    });

    app.component("app-header", Header);
    app.component("app-footer", Footer);
    app.component("auth-modal", AuthModal);
    app.component("toast-stack", Toast);
    app.component("ads-popup", AdsPopup);
    app.component("dashboard-view", Dashboard);
    app.component("profile-view", Profile);
    app.component("tickets-view", Tickets);
    app.component("guide-view", Guide);
    app.component("sponsor-view", Sponsor);

    app.mount("#app");
  </script>
</body>
</html>
