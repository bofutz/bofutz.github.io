<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>波幅探长 · 管理后台</title>
  <link rel="icon" type="image/png" href="./webpic/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    [v-cloak] { display: none !important; }
    body { background: #f4f6f8; -webkit-tap-highlight-color: transparent; }
    .theme-bg { background-color: #4da6a0; }
    .theme-text { color: #4da6a0; }
    .theme-border { border-color: #4da6a0; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .modal-overlay { background: rgba(0, 0, 0, .6); backdrop-filter: blur(2px); }
  </style>
</head>
<body class="text-slate-700 font-sans h-screen overflow-hidden select-none">

<div id="admin-app" v-cloak class="h-full flex flex-col">
  <div v-if="!isAuthenticated" class="fixed inset-0 z-50 bg-[#f4f6f8] flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200 text-center space-y-4">
      <div class="w-16 h-16 theme-bg rounded-2xl flex items-center justify-center mx-auto">
        <i class="fa-solid fa-shield-halved text-3xl text-white"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800">管理后台安全验证</h2>
      <input v-model="adminSecret" @keyup.enter="login" type="password" placeholder="请输入 Admin-Secret"
             class="w-full bg-slate-50 border px-4 py-3 rounded-lg text-center font-mono text-sm focus:theme-border outline-none">
      <button @click="login" class="w-full theme-bg text-white font-bold py-2.5 rounded-lg hover:opacity-90">登 录</button>
    </div>
  </div>

  <template v-else>
    <header class="bg-white border-b h-14 sm:h-16 shrink-0 flex items-center justify-between px-4 sm:px-6 z-20">
      <div class="flex items-center gap-2.5">
        <button @click="sidebarOpen = !sidebarOpen" class="md:hidden w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="text-base sm:text-lg font-bold text-slate-800">
          波幅探长
          <span class="text-xs text-slate-400 font-normal ml-1 bg-slate-100 px-2 py-0.5 rounded">管理后台 v5.1</span>
        </h1>
      </div>
      <div class="flex items-center gap-3">
        <a href="./index.html" target="_blank" class="text-xs sm:text-sm text-slate-500 hover:theme-text no-underline">
          <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>前台首页
        </a>
        <button @click="logout" class="text-xs sm:text-sm text-slate-500 hover:text-red-500">
          <i class="fa-solid fa-power-off mr-1"></i>退出
        </button>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
      <!-- 手机端抽屉遮罩 -->
      <div v-if="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-black/40 z-30 md:hidden"></div>

      <aside class="w-56 bg-white border-r py-4 flex flex-col shrink-0 z-40 transition-transform duration-200 fixed md:static inset-y-0 left-0"
             :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
        <div class="px-4 pb-3 mb-2 border-b md:hidden flex items-center justify-between">
          <span class="font-bold text-sm text-slate-700">导航菜单</span>
          <button @click="sidebarOpen = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="flex-1 space-y-1 px-3 custom-scrollbar overflow-y-auto">
          <div v-for="item in tabs" :key="item.k" @click="selectTab(item.k)"
               class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2 transition-colors"
               :class="currentTab===item.k?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i :class="item.icon" class="w-4 text-center"></i> {{ item.t }}
          </div>
        </nav>
      </aside>

      <main class="flex-1 overflow-y-auto custom-scrollbar p-3.5 sm:p-6 bg-slate-50/50">
        <component :is="currentComponent" @switch-tab="selectTab($event)"></component>
      </main>
    </div>
  </template>
  <v-toast></v-toast>
</div>

<script type="module">
  import { store } from "./js/store.js";
  import { CONFIG } from "./js/config.js";
  import Toast from "./js/components/common/Toast.js";
  import Dashboard from "./js/components/admin/Dashboard.js";
  import UserMgmt from "./js/components/admin/UserMgmt.js";
  import OrderMgmt from "./js/components/admin/OrderMgmt.js";
  import SharedWatch from "./js/components/admin/SharedWatch.js";
  import SettingsMgmt from "./js/components/admin/SettingsMgmt.js";
  import TicketMgmt from "./js/components/admin/TicketMgmt.js";
  import SponsorMgmt from "./js/components/admin/SponsorMgmt.js";

  const { createApp, ref, computed } = Vue;

  createApp({
    components: {
      "v-toast": Toast,
      Dashboard, UserMgmt, OrderMgmt, SharedWatch,
      SettingsMgmt, TicketMgmt, SponsorMgmt,
    },
    setup() {
      const adminSecret = ref(localStorage.getItem(CONFIG.STORAGE_KEYS.ADMIN_SECRET) || "");
      const isAuthenticated = ref(!!adminSecret.value);
      const currentTab = ref("dashboard");
      const sidebarOpen = ref(false);

      const tabs = [
        { k: "dashboard", t: "数据概览", icon: "fa-solid fa-chart-pie" },
        { k: "users", t: "用户管理", icon: "fa-solid fa-users" },
        { k: "orders", t: "订单审核", icon: "fa-solid fa-file-invoice-dollar" },
        { k: "sponsors", t: "赞助标的", icon: "fa-solid fa-hand-holding-heart" },
        { k: "shared", t: "默认监控列表", icon: "fa-solid fa-list" },
        { k: "tickets", t: "客服工单", icon: "fa-solid fa-headset" },
        { k: "settings", t: "系统设置", icon: "fa-solid fa-gear" },
      ];

      const selectTab = (k) => {
        currentTab.value = k;
        sidebarOpen.value = false;
      };

      const login = async () => {
        const secret = (adminSecret.value || "").trim();
        if (!secret) {
          store.showToast("请输入 Admin-Secret", "error");
          return;
        }
        try {
          const res = await fetch(`${CONFIG.API_BASE}/api/admin/settings`, {
            headers: { "Admin-Secret": secret, "Content-Type": "application/json" },
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.error || "鉴权失败");
          }
          localStorage.setItem(CONFIG.STORAGE_KEYS.ADMIN_SECRET, secret);
          adminSecret.value = secret;
          isAuthenticated.value = true;
          store.state.isAdminAuthenticated = true;
          store.showToast("鉴权登录成功");
        } catch (e) {
          localStorage.removeItem(CONFIG.STORAGE_KEYS.ADMIN_SECRET);
          isAuthenticated.value = false;
          store.showToast(e.message || "鉴权失败", "error");
        }
      };

      const logout = () => {
        localStorage.removeItem(CONFIG.STORAGE_KEYS.ADMIN_SECRET);
        isAuthenticated.value = false;
        adminSecret.value = "";
      };

      const currentComponent = computed(() => {
        const map = {
          dashboard: "Dashboard",
          users: "UserMgmt",
          orders: "OrderMgmt",
          sponsors: "SponsorMgmt",
          shared: "SharedWatch",
          settings: "SettingsMgmt",
          tickets: "TicketMgmt",
        };
        return map[currentTab.value] || "Dashboard";
      });

      return { adminSecret, isAuthenticated, currentTab, sidebarOpen, currentComponent, tabs, selectTab, login, logout };
    },
  }).mount("#admin-app");
</script>
</body>
</html>
