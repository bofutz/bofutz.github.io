<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>波幅探长 · 管理后台</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    [v-cloak] { display: none !important; }
    body { background: #f4f6f8; -webkit-tap-highlight-color: transparent; }
    .theme-bg { background-color: #4da6a0; }
    .theme-text { color: #4da6a0; }
    .theme-border { border-color: #4da6a0; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .modal-overlay { background: rgba(0, 0, 0, .6); backdrop-filter: blur(2px); }
  </style> 
</head>
<body class="text-slate-700 font-sans h-screen overflow-hidden select-none">

<div id="admin-app" v-cloak class="h-full flex flex-col">
  <!-- 管理员安全登录验证弹窗 -->
  <div v-if="!isAuthenticated" class="fixed inset-0 z-50 bg-[#f4f6f8] flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200 text-center space-y-4">
      <div class="w-16 h-16 theme-bg rounded-2xl flex items-center justify-center mx-auto">
        <i class="fa-solid fa-shield-halved text-3xl text-white"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800">管理后台安全验证</h2>
      <input v-model="adminSecret" @keyup.enter="login" type="password" placeholder="请输入 Admin-Secret"
             class="w-full bg-slate-50 border px-4 py-3 rounded-lg text-center font-mono text-sm focus:theme-border outline-none" />
      <button @click="login" class="w-full theme-bg text-white font-bold py-2.5 rounded-lg hover:opacity-90">登 录</button>
    </div>
  </div>

  <template v-else>
    <!-- 顶部 -->
    <header class="bg-white border-b h-16 shrink-0 flex items-center justify-between px-6 z-20">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold text-slate-800">
          波幅探长 
          <span class="text-xs text-slate-400 font-normal ml-1 bg-slate-100 px-2 py-0.5 rounded">管理后台 v2.6</span>
        </h1>
      </div>
      <button @click="logout" class="text-sm text-slate-500 hover:text-red-500">
        <i class="fa-solid fa-power-off mr-1"></i>退出
      </button>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- 侧边导航 -->
      <aside class="w-56 bg-white border-r py-4 flex flex-col shrink-0">
        <nav class="flex-1 space-y-1 px-3 custom-scrollbar overflow-y-auto">
          <div @click="currentTab='dashboard'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='dashboard'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-chart-pie w-4"></i> 数据概览
          </div>
          <div @click="currentTab='users'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='users'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-users w-4"></i> 用户管理
          </div>
          <div @click="currentTab='orders'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='orders'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-file-invoice-dollar w-4"></i> 订单审核
          </div>
          <div @click="currentTab='tickets'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='tickets'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-headset w-4"></i> 客服工单
          </div>
          <div @click="currentTab='plans'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='plans'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-tags w-4"></i> 套餐管理
          </div>
          <div @click="currentTab='chartQuery'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='chartQuery'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-magnifying-glass-chart w-4"></i> 自主查询
          </div>
          <div @click="currentTab='settings'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='settings'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-gear w-4"></i> 系统设置
          </div>
          <div @click="currentTab='vote'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='vote'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-check-to-slot w-4"></i> 票选监控
          </div>
          <div @click="currentTab='shared'" class="p-2.5 text-xs font-bold rounded-lg cursor-pointer flex items-center gap-2" :class="currentTab==='shared'?'theme-bg text-white':'text-slate-600 hover:bg-slate-50'">
            <i class="fa-solid fa-list w-4"></i> 监控列表
          </div>
        </nav>
      </aside>

      <!-- 主内容挂载区 -->
      <main class="flex-1 overflow-y-auto custom-scrollbar p-6 bg-slate-50/50">
        <component :is="currentComponent" @switch-tab="currentTab = $event"></component>
      </main>
    </div>
  </template>

  <v-toast></v-toast>
</div>

<!-- 完整 10 大后台分块组件脚本整合入口 -->
<script type="module">
  import { store } from "./js/store.js";
  import { CONFIG } from "./js/config.js";
  import Toast from "./js/components/common/Toast.js";

  // 后台 10 大分块组件
  import Dashboard from "./js/components/admin/Dashboard.js";
  import UserMgmt from "./js/components/admin/UserMgmt.js";
  import OrderMgmt from "./js/components/admin/OrderMgmt.js";
  import PlanMgmt from "./js/components/admin/PlanMgmt.js";
  import SharedWatch from "./js/components/admin/SharedWatch.js";
  import ChartQueryMgmt from "./js/components/admin/ChartQueryMgmt.js";
  import VoteMgmt from "./js/components/admin/VoteMgmt.js";
  import PromoMgmt from "./js/components/admin/PromoMgmt.js";
  import SettingsMgmt from "./js/components/admin/SettingsMgmt.js";
  import TicketMgmt from "./js/components/admin/TicketMgmt.js";

  // 改用 window.Vue 防止部分静态代码检查工具报 no-undef 错
  const { createApp, ref, computed } = window.Vue;

  createApp({
    components: {
      "v-toast": Toast,
      Dashboard,
      UserMgmt,
      OrderMgmt,
      PlanMgmt,
      SharedWatch,
      ChartQueryMgmt,
      VoteMgmt,
      PromoMgmt,
      SettingsMgmt,
      TicketMgmt,
    },
    setup() {
      const adminSecret = ref(localStorage.getItem(CONFIG.STORAGE_KEYS.ADMIN_SECRET) || "");
      const isAuthenticated = ref(!!adminSecret.value);
      const currentTab = ref("dashboard");

      const login = () => {
        if (!adminSecret.value) return;
        localStorage.setItem(CONFIG.STORAGE_KEYS.ADMIN_SECRET, adminSecret.value);
        isAuthenticated.value = true;
        store.showToast("鉴权登录成功");
      };

      const logout = () => {
        localStorage.removeItem(CONFIG.STORAGE_KEYS.ADMIN_SECRET);
        isAuthenticated.value = false;
        adminSecret.value = "";
      };

      const currentComponent = computed(() => {
        const map = {
          dashboard: "Dashboard",
          users:     "UserMgmt",
          orders:    "OrderMgmt",
          plans:     "PlanMgmt",
          shared:    "SharedWatch",
          chartQuery:"ChartQueryMgmt",
          vote:      "VoteMgmt",
          settings:  "SettingsMgmt",
          tickets:   "TicketMgmt",
          promo:     "PromoMgmt", // 补充遗漏的路由映射，防止 Linter 报错
        };
        return map[currentTab.value] || "Dashboard";
      });

      return {
        adminSecret,
        isAuthenticated,
        currentTab,
        currentComponent,
        login,
        logout,
      };
    },
  }).mount("#admin-app");
</script>
</body>
</html>
