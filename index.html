<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>波幅监控系统 - 波幅探长</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.3/viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.3/viewer.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    [v-cloak] { display: none !important; }
    body { -webkit-tap-highlight-color: transparent; background-color: #f4f6f8; }
    .theme-bg { background-color: #4da6a0; }
    .theme-text { color: #4da6a0; }
    .theme-border { border-color: #4da6a0; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .nav-item { transition: all 0.2s; color: #64748b; font-size: 14px; cursor: pointer; }
    .nav-item:hover:not(.active) { color: #4da6a0; }
    .nav-item.active { background-color: #e2e8f0; color: #334155; border-left: 3px solid #4da6a0; padding-left: 21px; }
    .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); }
    .social-item { position: relative; }
    .social-qr-pop {
      display: none; position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
      background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 50; width: 132px;
    }
    .social-item:hover .social-qr-pop { display: block; }
    .social-qr-pop img { width: 112px; height: 112px; object-fit: contain; }
  </style>
</head>
<body class="text-slate-700 font-sans h-screen overflow-hidden">

<div id="app" v-cloak class="flex flex-col h-full overflow-hidden">
  <v-header :page-title="pageTitle" @navigate="navigate"></v-header>
  <v-sidebar :current-route="currentRoute" @navigate="navigate"></v-sidebar>

  <main class="flex-1 overflow-auto custom-scrollbar p-3 sm:p-6 relative flex flex-col justify-between">
    <div class="flex-1">
      <component :is="currentComponent"></component>
    </div>
    <v-footer></v-footer>
  </main>

  <v-auth-modal></v-auth-modal>
  <v-toast></v-toast>
</div>

<script type="module">
  import { store } from "./js/store.js";
  import { etfApi } from "./js/api/etf.js";

  import Header from "./js/components/common/Header.js";
  import Sidebar from "./js/components/common/Sidebar.js";
  import Footer from "./js/components/common/Footer.js";
  import AuthModal from "./js/components/common/AuthModal.js";
  import Toast from "./js/components/common/Toast.js";

  import Dashboard from "./js/components/index/Dashboard.js";
  import Profile from "./js/components/index/Profile.js";
  import Plan from "./js/components/index/Plan.js";
  import Vote from "./js/components/index/Vote.js";
  import Tickets from "./js/components/index/Tickets.js";
  import Guide from "./js/components/index/Guide.js";

  const { createApp, ref, computed, onMounted } = Vue;

  createApp({
    components: {
      "v-header": Header,
      "v-sidebar": Sidebar,
      "v-footer": Footer,
      "v-auth-modal": AuthModal,
      "v-toast": Toast,
      Dashboard,
      Profile,
      Plan,
      Vote,
      Tickets,
      Guide,
    },
    setup() {
      const currentRoute = ref(window.location.hash || "#/");

      const navigate = (path) => {
        currentRoute.value = path;
        window.location.hash = path;
      };

      const currentComponent = computed(() => {
        switch (currentRoute.value) {
          case "#/profile": return "Profile";
          case "#/plan":    return "Plan";
          case "#/vote":    return "Vote";
          case "#/tickets": return "Tickets";
          case "#/guide":   return "Guide";
          default:          return "Dashboard";
        }
      });

      const pageTitle = computed(() => {
        const map = {
          "#/":         "数据看板",
          "#/profile":  "个人中心",
          "#/plan":     "购买套餐",
          "#/vote":     "票选监控",
          "#/tickets":  "客服工单",
          "#/guide":    "图表指南",
        };
        return map[currentRoute.value] || "数据看板";
      });

      /** 拉取后台公共配置，写入 store（优惠码/赠送天数/支付通道等） */
      const bootstrapPublicSettings = async () => {
        try {
          // 优先用 store 内置方法（若已升级 store.js）
          if (typeof store.loadPublicSettings === "function") {
            await store.loadPublicSettings();
            return;
          }
          // 兼容 etfApi
          const res = await etfApi.fetchPublicSettings();
          const payload = res?.data || res;
          if (payload && typeof payload === "object") {
            store.setPublicSettings(payload);
          }
        } catch (e) {
          console.error("加载公共配置失败:", e);
        }
      };

      onMounted(async () => {
        store.checkLoginState();
        await bootstrapPublicSettings();

        window.addEventListener("hashchange", () => {
          currentRoute.value = window.location.hash || "#/";
        });
      });

      return {
        currentRoute,
        currentComponent,
        pageTitle,
        navigate,
      };
    },
  }).mount("#app");
</script>
</body>
</html>
