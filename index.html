<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>波幅探长 - 波幅监控</title>
  <meta name="description" content="波幅探长：ETF 波幅监控、票选与定制图表服务" />
  <link rel="icon" type="image/png" href="./logo.png" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Viewer.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
  <!-- Turnstile: 移除 defer 以符合标准 -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async></script>

  <style>
    :root {
      --theme: #4da6a0;
      --theme-dark: #3d8a85;
    }
    .theme-bg { background-color: var(--theme); }
    .theme-text { color: var(--theme); }
    .theme-border { border-color: var(--theme); }
    .focus\:theme-border:focus { border-color: var(--theme); box-shadow: 0 0 0 2px rgba(77, 166, 160, 0.15); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7f9;
      min-height: 100dvh;
    }
    .modal-overlay {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
    }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    .etf-name-column {
      min-width: 120px;
      max-width: 160px;
    }
    @media (min-width: 640px) {
      .etf-name-column { min-width: 160px; max-width: 220px; }
    }
  
    .dash-board-table { table-layout: fixed; width: 100%; }
    .dash-board-table .dash-col-name { width: 200px; min-width: 180px; max-width: 240px; }
    .dash-board-table .dash-col-day { width: 88px; }
    .dash-board-table .dash-col-week { width: 100px; }
    @media (max-width: 640px) {
      .dash-board-table .dash-col-name { width: 140px; min-width: 120px; }
      .dash-board-table .dash-col-day { width: 72px; }
      .dash-board-table .dash-col-week { width: 80px; }
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="app" class="min-h-[100dvh] flex flex-col">
    <!-- 顶栏 -->
    <app-header></app-header>

    <!-- 主内容 -->
    <main class="flex-1 w-full px-3 sm:px-4 py-4 sm:py-6">
      <component :is="currentView"></component>
    </main>

    <!-- 页脚 -->
    <app-footer></app-footer>

    <!-- 登录 / 注册 / 忘记密码 -->
    <auth-modal></auth-modal>

    <!-- 全局 Toast -->
    <toast-stack></toast-stack>

    <!-- 弹窗广告 -->
    <ads-popup></ads-popup>
  </div>

  <script type="module">
    import { store } from "./js/store.js";
    import { CONFIG } from "./js/config.js";
    import { authApi } from "./js/api/auth.js";

    import Header from "./js/components/common/Header.js";
    import Footer from "./js/components/common/Footer.js";
    import AuthModal from "./js/components/common/AuthModal.js";
    import Toast from "./js/components/common/Toast.js";
    import AdsPopup from "./js/components/common/AdsPopup.js";

    import Dashboard from "./js/components/index/Dashboard.js";
    import Plan from "./js/components/index/Plan.js";
    import Profile from "./js/components/index/Profile.js";
    import Vote from "./js/components/index/Vote.js";
    import Tickets from "./js/components/index/Tickets.js";
    import Guide from "./js/components/index/Guide.js";
    import Query from "./js/components/index/Query.js";

    // 使用 window.Vue 防止部分静态代码检查工具报 no-undef 错
    const { createApp, ref, computed, onMounted, watch } = window.Vue;

    const routes = {
      "/": "dashboard-view",
      "/plan": "plan-view",
      "/query": "query-view",
      "/profile": "profile-view",
      "/vote": "vote-view",
      "/tickets": "tickets-view",
      "/guide": "guide-view",
    };

    function parseHash() {
      const raw = (window.location.hash || "#/").replace(/^#/, "") || "/";
      const path = raw.split("?")[0];
      return routes[path] ? path : "/";
    }

    const app = createApp({
      setup() {
        const routePath = ref(parseHash());

        const currentView = computed(() => routes[routePath.value] || "dashboard-view");

        const syncRoute = () => {
          routePath.value = parseHash();
          store.state.menuOpen = false;
          store.state.userMenuOpen = false;
          // 改用标准支持的滚动行为参数
          window.scrollTo({ top: 0, behavior: "auto" });
        };

        const refreshMe = async () => {
          if (!store.state.isLoggedIn) return;
          try {
            const res = await authApi.getMe();
            const d = res ? (res.data || res) : null;
            if (!d) return;

            // 移除 ?? 等新语法，改用兼容性更好的判断，避免部分 CI 工具解析崩溃
            const vipDays = d.shared_vip_days !== undefined && d.shared_vip_days !== null 
              ? d.shared_vip_days 
              : (d.vip_days_left !== undefined && d.vip_days_left !== null ? d.vip_days_left : 0);
              
            const vLevel = d.vip_level !== undefined && d.vip_level !== null ? d.vip_level : 0;
            const cCredits = d.chart_credits !== undefined && d.chart_credits !== null ? d.chart_credits : 0;

            store.setUserState({
              username: d.username,
              referralCode: d.referral_code,
              vipDaysLeft: vipDays,
              vipLevel: vLevel,
              chartCredits: cCredits,
            });

            if (d.security_set !== undefined && d.security_set !== null) {
              if (store.setSecuritySet) {
                store.setSecuritySet(!!d.security_set);
              }
            }
          } catch (e) {
            if (String(e.message || "").includes("401") || e.status === 401) {
              store.clearUserState();
            }
          }
        };

        onMounted(async () => {
          store.checkLoginState();
          await store.loadPublicSettings();
          await refreshMe();
          window.addEventListener("hashchange", syncRoute);
        });

        watch(
          () => store.state.isLoggedIn,
          (v) => {
            if (v) refreshMe();
          }
        );

        return {
          currentView,
          store: store.state,
        };
      },
    });

    app.component("app-header", Header);
    app.component("app-footer", Footer);
    app.component("auth-modal", AuthModal);
    app.component("toast-stack", Toast);
    app.component("ads-popup", AdsPopup);

    app.component("dashboard-view", Dashboard);
    app.component("plan-view", Plan);
    app.component("profile-view", Profile);
    app.component("vote-view", Vote);
    app.component("tickets-view", Tickets);
    app.component("guide-view", Guide);
    app.component("query-view", Query);

    app.mount("#app");
  </script>
</body>
</html>
