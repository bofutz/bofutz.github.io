<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波幅监控系统 - 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        body { background-color: #f4f6f8; -webkit-tap-highlight-color: transparent; }
        
        /* 统一首页的青色主题 */
        .theme-bg { background-color: #4da6a0; }
        .theme-text { color: #4da6a0; }
        .theme-border { border-color: #4da6a0; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .nav-item { transition: all 0.2s; color: #64748b; font-size: 14px; cursor: pointer; }
        .nav-item i { width: 24px; text-align: center; margin-right: 8px; color: #94a3b8; font-size: 16px; }
        .nav-item:hover:not(.active) { color: #4da6a0; }
        .nav-item:hover:not(.active) i { color: #4da6a0; }
        .nav-item.active { background-color: #e2e8f0; color: #334155; border-left: 3px solid #4da6a0; padding-left: 21px; font-weight: 500; }
        .nav-item.active i { color: #4da6a0; }
    </style>
</head>
<body class="text-slate-700 font-sans h-screen overflow-hidden select-none">

    <div id="admin-app" v-cloak class="h-full flex flex-col">
        
        <!-- ================= 鉴权登录页 (浅色化) ================= -->
        <div v-if="!isAuthenticated" class="fixed inset-0 z-50 bg-[#f4f6f8] flex items-center justify-center">
            <div class="bg-white p-8 rounded shadow-sm w-full max-w-sm border border-slate-200 text-center">
                <div class="w-16 h-16 theme-bg rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                    <i class="fa-solid fa-shield-halved text-3xl text-white"></i>
                </div>
                <h2 class="text-xl font-medium text-slate-700 mb-6">管理后台安全验证</h2>
                <input v-model="adminSecret" @keyup.enter="login" type="password" placeholder="请输入 Admin-Secret" class="w-full bg-slate-50 border border-slate-200 text-slate-700 px-4 py-3 rounded focus:outline-none focus:theme-border mb-4 text-center tracking-widest font-mono">
                <button @click="login" :disabled="loading" class="w-full theme-bg text-white font-medium py-2.5 rounded transition hover:opacity-90 disabled:opacity-50 flex justify-center items-center shadow-sm">
                    <i v-if="loading" class="fa-solid fa-spinner animate-spin mr-2"></i> 登 录
                </button>
                <p v-if="errorMsg" class="text-red-500 text-xs mt-3">{{ errorMsg }}</p>
            </div>
        </div>

        <!-- ================= 后台主体 ================= -->
        <template v-else>
            <!-- 顶部导航 -->
            <header class="bg-white border-b border-slate-200 h-16 shrink-0 flex items-center justify-between px-6 z-10">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-server theme-text text-xl"></i>
                    <h1 class="text-lg font-bold text-slate-700 tracking-wide">波幅探长 <span class="text-xs text-slate-400 font-normal ml-2">Admin Center</span></h1>
                </div>
                <button @click="logout" class="text-sm text-slate-500 hover:text-red-500 transition-colors"><i class="fa-solid fa-power-off mr-1"></i> 安全退出</button>
            </header>

            <div class="flex flex-1 overflow-hidden">
                <!-- 左侧侧边栏 (洗牌重排) -->
                <aside class="w-56 bg-white border-r border-slate-200 flex flex-col py-6 z-10 shadow-sm">
                    <nav class="flex-1 space-y-1.5">
                        <!-- 第一位：用户管理 -->
                        <div @click="currentTab = 'users'; fetchUsers()" class="nav-item flex items-center px-6 py-3" :class="{'active': currentTab === 'users'}">
                            <i class="fa-solid fa-users"></i> 用户管理
                        </div>
                        
                        <!-- 第二位：订单审核 -->
                        <div @click="currentTab = 'orders'; fetchOrders()" class="nav-item flex items-center px-6 py-3" :class="{'active': currentTab === 'orders'}">
                            <i class="fa-solid fa-file-invoice-dollar"></i> 订单审核
                            <span v-if="pendingOrdersCount > 0" class="ml-auto bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">{{ pendingOrdersCount }}</span>
                        </div>
                        
                        <!-- 第三位：答疑工单 -->
                        <div @click="currentTab = 'tickets'; fetchTickets()" class="nav-item flex items-center px-6 py-3" :class="{'active': currentTab === 'tickets'}">
                            <i class="fa-solid fa-headset"></i> 答疑工单
                            <span v-if="pendingTicketsCount > 0" class="ml-auto bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">{{ pendingTicketsCount }}</span>
                        </div>

                        <!-- 第四位：套餐管理 -->
                        <div @click="currentTab = 'plans'; fetchPlans()" class="nav-item flex items-center px-6 py-3" :class="{'active': currentTab === 'plans'}">
                            <i class="fa-solid fa-tags"></i> 套餐管理
                        </div>
                    </nav>
                </aside>

                <!-- 右侧内容区 -->
                <main class="flex-1 overflow-y-auto custom-scrollbar p-6 relative">
                    <div v-if="loading" class="h-full flex flex-col items-center justify-center text-slate-400">
                        <i class="fa-solid fa-circle-notch animate-spin text-3xl mb-3"></i><p class="text-sm">读取数据中...</p>
                    </div>

                    <div v-else class="max-w-7xl mx-auto h-full">
                        
                        <!-- ================= 面板 1：用户管理 ================= -->
                        <div v-if="currentTab === 'users'" class="space-y-4">
                            <div class="flex justify-between items-end mb-4">
                                <div><h2 class="text-xl font-medium text-slate-700">用户管理中心</h2></div>
                                <button @click="fetchUsers" class="text-sm bg-white border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded text-slate-600 shadow-sm transition"><i class="fa-solid fa-rotate-right mr-1"></i> 刷新数据</button>
                            </div>
                            
                            <div class="bg-white border border-slate-100 shadow-sm rounded overflow-hidden">
                                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                                    <thead class="bg-slate-50 border-b border-slate-100 text-slate-500">
                                        <tr><th class="py-4 px-6 font-medium">ID / 注册时间</th><th class="py-4 px-6 font-medium">用户名</th><th class="py-4 px-6 font-medium">VIP天数</th><th class="py-4 px-6 font-medium text-emerald-600">钱包余额</th><th class="py-4 px-6 font-medium">邀请码</th><th class="py-4 px-6 font-medium text-right">管理操作</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-50">
                                        <tr v-for="u in users" :key="u.id" class="hover:bg-slate-50 transition-colors">
                                            <td class="py-4 px-6 text-xs text-slate-400">ID:{{ u.id }}<br>{{ formatDate(u.created_at) }}</td>
                                            <td class="py-4 px-6 font-bold text-slate-700">{{ u.username }}</td>
                                            <td class="py-4 px-6"><span :class="u.vip_days_left > 0 ? 'text-emerald-500 font-bold' : 'text-slate-400'">{{ u.vip_days_left }} 天</span></td>
                                            <td class="py-4 px-6 font-mono text-emerald-600 font-medium">¥ {{ (u.balance || 0).toFixed(2) }}</td>
                                            <td class="py-4 px-6 font-mono text-xs text-slate-500">{{ u.referral_code || '-' }}</td>
                                            <td class="py-4 px-6 text-right space-x-2">
                                                <button @click="manualCharge(u)" class="text-xs bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-1.5 rounded transition">充天数</button>
                                                <button @click="deleteUser(u)" class="text-xs bg-red-50 text-red-500 hover:bg-red-100 px-3 py-1.5 rounded transition">删除账户</button>
                                            </td>
                                        </tr>
                                        <tr v-if="users.length === 0"><td colspan="6" class="py-12 text-center text-slate-400">暂无用户记录</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- ================= 面板 2：订单审核 ================= -->
                        <div v-if="currentTab === 'orders'" class="space-y-4 h-full flex flex-col">
                            <div class="flex justify-between items-end mb-4">
                                <div><h2 class="text-xl font-medium text-slate-700">支付订单审核</h2><p class="text-xs text-slate-500 mt-1">核对账单后通过，或对于乱填单号的订单直接驳回。</p></div>
                                <button @click="fetchOrders" class="text-sm bg-white border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded text-slate-600 shadow-sm transition"><i class="fa-solid fa-rotate-right mr-1"></i> 刷新数据</button>
                            </div>
                            
                            <div class="bg-white border border-slate-100 shadow-sm rounded overflow-hidden flex-1">
                                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                                    <thead class="bg-slate-50 border-b border-slate-100 text-slate-500">
                                        <tr><th class="py-4 px-6 font-medium">时间</th><th class="py-4 px-6 font-medium">用户</th><th class="py-4 px-6 font-medium">套餐</th><th class="py-4 px-6 font-medium">应收金额</th><th class="py-4 px-6 font-medium text-orange-500">凭证后6位</th><th class="py-4 px-6 font-medium">状态</th><th class="py-4 px-6 font-medium text-right">审核操作</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-50">
                                        <tr v-for="order in orders" :key="order.id" class="hover:bg-slate-50 transition-colors">
                                            <td class="py-4 px-6 text-xs text-slate-400">{{ formatDate(order.created_at) }}</td>
                                            <td class="py-4 px-6 font-bold text-slate-700">{{ order.username }}</td>
                                            <td class="py-4 px-6"><span class="bg-slate-100 px-2 py-1 rounded text-xs text-slate-600">{{ getPlanName(order.plan_id) }}</span></td>
                                            <td class="py-4 px-6 font-bold text-slate-700">¥{{ order.amount.toFixed(2) }}</td>
                                            <td class="py-4 px-6 font-mono font-bold text-orange-500 tracking-widest">{{ order.tx_id_last6 }}</td>
                                            <td class="py-4 px-6">
                                                <span v-if="order.status === 'pending'" class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded-full">待审核</span>
                                                <span v-else-if="order.status === 'approved'" class="text-xs bg-emerald-100 text-emerald-600 px-2 py-1 rounded-full">已通过</span>
                                                <span v-else class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">已驳回</span>
                                            </td>
                                            <td class="py-4 px-6 text-right space-x-2">
                                                <template v-if="order.status === 'pending'">
                                                    <button @click="approveOrder(order)" class="theme-bg hover:opacity-90 text-white text-xs font-medium px-4 py-1.5 rounded shadow-sm transition">确认收款通过</button>
                                                    <button @click="rejectOrder(order)" class="bg-slate-100 hover:bg-red-50 text-slate-500 hover:text-red-500 text-xs font-medium px-4 py-1.5 rounded transition">驳回失效</button>
                                                </template>
                                                <span v-else class="text-slate-300 text-xs">-</span>
                                            </td>
                                        </tr>
                                        <tr v-if="orders.length === 0"><td colspan="7" class="py-12 text-center text-slate-400">暂无订单记录</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- ================= 面板 3：答疑工单 (新增删除与清理) ================= -->
                        <div v-if="currentTab === 'tickets'" class="space-y-4 h-full flex flex-col">
                            <div class="flex justify-between items-end mb-4">
                                <div><h2 class="text-xl font-medium text-slate-700">答疑工单处理</h2></div>
                                <div class="space-x-3">
                                    <button v-if="tickets.some(t => t.status==='replied')" @click="clearTickets" class="text-sm bg-red-50 text-red-500 hover:bg-red-100 border border-red-100 px-4 py-2 rounded shadow-sm transition"><i class="fa-solid fa-trash-can mr-1"></i> 清理已回复</button>
                                    <button @click="fetchTickets" class="text-sm bg-white border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded text-slate-600 shadow-sm transition"><i class="fa-solid fa-rotate-right mr-1"></i> 刷新数据</button>
                                </div>
                            </div>
                            
                            <div class="bg-white border border-slate-100 shadow-sm rounded overflow-hidden flex-1">
                                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                                    <thead class="bg-slate-50 border-b border-slate-100 text-slate-500">
                                        <tr><th class="py-4 px-6 font-medium w-40">提交时间</th><th class="py-4 px-6 font-medium w-32">提问用户</th><th class="py-4 px-6 font-medium w-24">等级</th><th class="py-4 px-6 font-medium">主题概览</th><th class="py-4 px-6 font-medium w-24">状态</th><th class="py-4 px-6 font-medium text-right w-40">管理操作</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-50">
                                        <tr v-for="ticket in tickets" :key="ticket.id" class="hover:bg-slate-50 transition-colors">
                                            <td class="py-4 px-6 text-xs text-slate-400">{{ formatDate(ticket.created_at) }}</td>
                                            <td class="py-4 px-6 font-bold text-slate-700">{{ ticket.username }}</td>
                                            <td class="py-4 px-6"><span :class="{'text-red-500': ticket.level === 'high', 'text-orange-500': ticket.level === 'medium', 'text-slate-400': ticket.level === 'low'}" class="text-xs font-bold uppercase">{{ ticket.level }}</span></td>
                                            <td class="py-4 px-6"><div class="font-medium text-slate-700 truncate max-w-[250px]">{{ ticket.subject }}</div></td>
                                            <td class="py-4 px-6">
                                                <span v-if="ticket.status === 'pending'" class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded-full">待回复</span>
                                                <span v-else class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">已回复</span>
                                            </td>
                                            <td class="py-4 px-6 text-right space-x-2">
                                                <button v-if="ticket.status === 'pending'" @click="openReplyModal(ticket)" class="bg-orange-50 text-orange-600 hover:bg-orange-100 text-xs font-medium px-3 py-1.5 rounded transition">解答</button>
                                                <button v-else @click="openReplyModal(ticket)" class="bg-slate-50 text-slate-500 hover:bg-slate-100 text-xs font-medium px-3 py-1.5 rounded transition">查看</button>
                                                <button @click="deleteTicket(ticket.id)" class="text-slate-300 hover:text-red-500 transition px-2"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                        <tr v-if="tickets.length === 0"><td colspan="6" class="py-12 text-center text-slate-400">暂无工单记录</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- ================= 面板 4：套餐管理 ================= -->
                        <div v-if="currentTab === 'plans'" class="space-y-4 h-full flex flex-col">
                            <div class="flex justify-between items-end mb-4">
                                <div><h2 class="text-xl font-medium text-slate-700">VIP套餐动态管理</h2><p class="text-xs text-slate-500 mt-1">前端展示的套餐将实时读取此处的配置。</p></div>
                                <button @click="openPlanModal()" class="text-sm theme-bg hover:opacity-90 px-4 py-2 rounded text-white font-medium shadow-sm transition"><i class="fa-solid fa-plus mr-1"></i> 新增套餐</button>
                            </div>
                            
                            <div class="bg-white border border-slate-100 shadow-sm rounded overflow-hidden flex-1">
                                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                                    <thead class="bg-slate-50 border-b border-slate-100 text-slate-500">
                                        <tr><th class="py-4 px-6 font-medium">标识ID</th><th class="py-4 px-6 font-medium">套餐名称</th><th class="py-4 px-6 font-medium">价格</th><th class="py-4 px-6 font-medium">发货天数</th><th class="py-4 px-6 font-medium">角标签</th><th class="py-4 px-6 font-medium">排序</th><th class="py-4 px-6 font-medium text-right">操作</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-50">
                                        <tr v-for="p in plans" :key="p.id" class="hover:bg-slate-50 transition-colors">
                                            <td class="py-4 px-6 font-mono text-slate-400">{{ p.id }}</td>
                                            <td class="py-4 px-6 font-bold text-slate-700">{{ p.name }}</td>
                                            <td class="py-4 px-6 font-bold text-slate-700">¥{{ p.price.toFixed(2) }}</td>
                                            <td class="py-4 px-6 text-emerald-600 font-medium">+{{ p.days }} 天</td>
                                            <td class="py-4 px-6"><span v-if="p.tag" class="bg-orange-100 text-orange-600 px-2 py-0.5 rounded text-xs">{{ p.tag }}</span><span v-else class="text-slate-300">-</span></td>
                                            <td class="py-4 px-6 font-mono text-slate-500">{{ p.sort_order }}</td>
                                            <td class="py-4 px-6 text-right space-x-3">
                                                <button @click="openPlanModal(p)" class="text-slate-400 hover:theme-text transition"><i class="fa-solid fa-pen-to-square"></i></button>
                                                <button @click="deletePlan(p)" class="text-slate-400 hover:text-red-500 transition"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                        <tr v-if="plans.length === 0"><td colspan="7" class="py-12 text-center text-slate-400">暂无套餐数据</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>

                    <!-- 回复工单的专属弹窗 -->
                    <div v-if="replyModalVisible" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                        <div class="bg-white rounded w-full max-w-lg shadow-2xl flex flex-col overflow-hidden">
                            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                <h3 class="font-medium text-slate-700"><i class="fa-solid fa-headset text-orange-500 mr-2"></i> {{ currentTicket.status === 'pending' ? '解答用户工单' : '工单处理详情' }}</h3>
                                <button @click="replyModalVisible = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div class="p-6 space-y-5">
                                <div>
                                    <div class="text-xs text-slate-400 mb-1 flex justify-between"><span>提问用户：{{ currentTicket.username }}</span><span>{{ formatDate(currentTicket.created_at) }}</span></div>
                                    <div class="bg-slate-50 p-4 rounded border border-slate-100 text-sm text-slate-600">
                                        <p class="font-bold text-slate-700 mb-2">{{ currentTicket.subject }}</p>
                                        <p class="whitespace-pre-wrap">{{ currentTicket.message }}</p>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-2">官方回复内容：</label>
                                    <textarea v-model="replyMessage" :readonly="currentTicket.status !== 'pending'" rows="4" :placeholder="currentTicket.status === 'pending' ? '请输入详细解答，提交后用户将在前端看到...' : '无回复内容记录'" class="w-full border border-slate-200 text-slate-700 px-4 py-3 rounded focus:outline-none focus:theme-border text-sm custom-scrollbar bg-white"></textarea>
                                </div>
                            </div>
                            <div class="px-6 py-4 bg-slate-50 flex justify-end gap-3 border-t border-slate-100">
                                <button @click="replyModalVisible = false" class="px-5 py-2 rounded text-sm text-slate-500 hover:bg-slate-200 transition">关闭</button>
                                <button v-if="currentTicket.status === 'pending'" @click="submitReply" class="px-5 py-2 rounded text-sm text-white font-medium bg-orange-500 hover:bg-orange-600 shadow-sm transition">提交回复并结单</button>
                            </div>
                        </div>
                    </div>

                    <!-- 套餐编辑弹窗 -->
                    <div v-if="planModalVisible" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                        <div class="bg-white rounded w-full max-w-sm shadow-2xl flex flex-col overflow-hidden">
                            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                <h3 class="font-medium text-slate-700"><i class="fa-solid fa-tags theme-text mr-2"></i> {{ planForm.isEdit ? '编辑套餐' : '新增套餐' }}</h3>
                                <button @click="planModalVisible = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div class="p-6 space-y-4">
                                <div><label class="block text-xs text-slate-500 mb-1">唯一标识ID (如: month)</label><input v-model="planForm.id" :disabled="planForm.isEdit" type="text" class="w-full border border-slate-200 px-3 py-2 rounded text-sm focus:outline-none focus:theme-border disabled:bg-slate-50 disabled:text-slate-400"></div>
                                <div><label class="block text-xs text-slate-500 mb-1">套餐显示名称</label><input v-model="planForm.name" type="text" class="w-full border border-slate-200 px-3 py-2 rounded text-sm focus:outline-none focus:theme-border text-slate-700"></div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div><label class="block text-xs text-slate-500 mb-1">价格 (元)</label><input v-model.number="planForm.price" type="number" step="0.01" class="w-full border border-slate-200 px-3 py-2 rounded text-sm focus:outline-none focus:theme-border text-slate-700"></div>
                                    <div><label class="block text-xs text-slate-500 mb-1">发货天数</label><input v-model.number="planForm.days" type="number" class="w-full border border-slate-200 px-3 py-2 rounded text-sm focus:outline-none focus:theme-border text-slate-700"></div>
                                </div>
                                <div><label class="block text-xs text-slate-500 mb-1">角标标签 (选填)</label><input v-model="planForm.tag" type="text" placeholder="如：推荐" class="w-full border border-slate-200 px-3 py-2 rounded text-sm focus:outline-none focus:theme-border text-slate-700"></div>
                                <div><label class="block text-xs text-slate-500 mb-1">展示排序 (越小越靠前)</label><input v-model.number="planForm.sort_order" type="number" class="w-full border border-slate-200 px-3 py-2 rounded text-sm focus:outline-none focus:theme-border text-slate-700"></div>
                            </div>
                            <div class="px-6 py-4 bg-slate-50 flex justify-end gap-3 border-t border-slate-100">
                                <button @click="planModalVisible = false" class="px-5 py-2 rounded text-sm text-slate-500 hover:bg-slate-200 transition">取消</button>
                                <button @click="submitPlan" class="px-5 py-2 rounded text-sm text-white font-medium theme-bg hover:opacity-90 shadow-sm transition">保存配置</button>
                            </div>
                        </div>
                    </div>

                </main>
            </div>
        </template>
    </div>

    <script>
        const { createApp, ref, computed, reactive, onMounted } = Vue;
        const API_BASE = "https://vip.hahagw.eu.org"; 

        createApp({
            setup() {
                const adminSecret = ref(localStorage.getItem('admin_secret') || '');
                const isAuthenticated = ref(false);
                const currentTab = ref('users'); // 默认进用户管理
                const loading = ref(false);
                const errorMsg = ref('');

                const orders = ref([]);
                const users = ref([]);
                const tickets = ref([]); 
                const plans = ref([]);

                const replyModalVisible = ref(false);
                const currentTicket = ref(null);
                const replyMessage = ref('');

                const planModalVisible = ref(false);
                const planForm = reactive({ id: '', name: '', price: 0, days: 0, tag: '', sort_order: 0, isEdit: false });

                const pendingOrdersCount = computed(() => orders.value.filter(o => o.status === 'pending').length);
                const pendingTicketsCount = computed(() => tickets.value.filter(t => t.status === 'pending').length);

                const getPlanName = (planId) => {
                    const p = plans.value.find(x => x.id === planId);
                    return p ? p.name : planId;
                };

                const fetchAdmin = async (endpoint, options = {}) => {
                    const res = await fetch(`${API_BASE}${endpoint}`, {
                        ...options, headers: { 'Content-Type': 'application/json', 'Admin-Secret': adminSecret.value, ...options.headers }
                    });
                    if (res.status === 401) { isAuthenticated.value = false; localStorage.removeItem('admin_secret'); throw new Error('鉴权失败，密码错误'); }
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return await res.json();
                };

                const login = async () => {
                    if (!adminSecret.value) return;
                    loading.value = true; errorMsg.value = '';
                    try {
                        await fetchAdmin('/api/admin/plans'); // 改用 plans 测试联通性
                        isAuthenticated.value = true;
                        localStorage.setItem('admin_secret', adminSecret.value);
                        fetchUsers(); fetchPlans(); fetchOrders(); fetchTickets(); 
                    } catch (err) { errorMsg.value = err.message; } 
                    finally { loading.value = false; }
                };
                const logout = () => { isAuthenticated.value = false; adminSecret.value = ''; localStorage.removeItem('admin_secret'); };

                // --- 用户 ---
                const fetchUsers = async () => {
                    loading.value = true;
                    try { const data = await fetchAdmin('/api/admin/users'); if (data.success) users.value = data.data; } catch (e) {}
                    loading.value = false;
                };
                const manualCharge = async (user) => {
                    const days = prompt(`请输入要赠送给【${user.username}】的 VIP 天数：`, "7");
                    if (!days || isNaN(days)) return;
                    try {
                        const data = await fetchAdmin('/api/admin/users/charge', { method: 'POST', body: JSON.stringify({ user_id: user.id, add_days: parseInt(days, 10) }) });
                        if (data.success) { alert('操作成功！'); fetchUsers(); }
                    } catch (e) { alert('操作失败'); }
                };
                const deleteUser = async (user) => {
                    if (!confirm(`【警告】确定要永久删除用户 ${user.username} 吗？\n所有相关数据将丢失！`)) return;
                    try {
                        const data = await fetchAdmin('/api/admin/users', { method: 'DELETE', body: JSON.stringify({ user_id: user.id }) });
                        if (data.success) { alert('用户已删除！'); fetchUsers(); }
                    } catch (e) { alert('删除失败'); }
                };

                // --- 订单 ---
                const fetchOrders = async () => {
                    loading.value = true;
                    try { const data = await fetchAdmin('/api/admin/orders'); if (data.success) orders.value = data.data; } catch (e) {}
                    loading.value = false;
                };

                const approveOrder = async (order) => {
                    if (!confirm(`确认收到款项并发放会员？`)) return;
                    const planObj = plans.value.find(p => p.id === order.plan_id);
                    const addDays = planObj ? planObj.days : 30; 
                    try {
                        const data = await fetchAdmin('/api/admin/orders/approve', { method: 'POST', body: JSON.stringify({ order_id: order.id, user_id: order.user_id, add_days: addDays }) });
                        if (data.success) { alert('发放成功！'); fetchOrders(); }
                    } catch (e) { alert('操作失败'); }
                };

                const rejectOrder = async (order) => {
                    if (!confirm(`确认驳回并取消这笔无用订单吗？`)) return;
                    try {
                        const data = await fetchAdmin('/api/admin/orders/reject', { method: 'POST', body: JSON.stringify({ order_id: order.id }) });
                        if (data.success) { fetchOrders(); }
                    } catch (e) { alert('操作失败'); }
                };

                // --- 工单 ---
                const fetchTickets = async () => {
                    loading.value = true;
                    try { const data = await fetchAdmin('/api/admin/tickets'); if (data.success) tickets.value = data.data; } catch (e) {}
                    loading.value = false;
                };
                const openReplyModal = (ticket) => { currentTicket.value = ticket; replyMessage.value = ticket.admin_reply || ''; replyModalVisible.value = true; };
                const submitReply = async () => {
                    if (!replyMessage.value.trim()) { alert('回复内容不能为空！'); return; }
                    try {
                        const data = await fetchAdmin('/api/admin/tickets/reply', { method: 'POST', body: JSON.stringify({ ticket_id: currentTicket.value.id, reply_message: replyMessage.value }) });
                        if (data.success) { alert('解答提交成功！'); replyModalVisible.value = false; fetchTickets(); }
                    } catch (e) { alert('提交失败'); }
                };
                const deleteTicket = async (id) => {
                    if (!confirm('确定永久删除该工单记录吗？')) return;
                    try {
                        await fetchAdmin('/api/admin/tickets', { method: 'DELETE', body: JSON.stringify({ ticket_id: id }) });
                        fetchTickets();
                    } catch (e) { alert('删除失败'); }
                };
                const clearTickets = async () => {
                    if (!confirm('【清理确认】这将会删除所有“已回复”状态的工单，不可恢复！')) return;
                    try {
                        await fetchAdmin('/api/admin/tickets/clear', { method: 'POST' });
                        alert('清理完毕！'); fetchTickets();
                    } catch (e) { alert('清理失败'); }
                };

                // --- 套餐 ---
                const fetchPlans = async () => {
                    loading.value = true;
                    try { const data = await fetchAdmin('/api/admin/plans'); if (data.success) plans.value = data.data; } catch (e) {}
                    loading.value = false;
                };

                const openPlanModal = (p = null) => {
                    if (p) { Object.assign(planForm, p); planForm.isEdit = true; } 
                    else { Object.assign(planForm, { id: '', name: '', price: 0, days: 0, tag: '', sort_order: 0, isEdit: false }); }
                    planModalVisible.value = true;
                };

                const submitPlan = async () => {
                    if (!planForm.id || !planForm.name || !planForm.days) { alert("ID、名称和天数必须填写！"); return; }
                    try {
                        const data = await fetchAdmin('/api/admin/plans', { method: 'POST', body: JSON.stringify(planForm) });
                        if (data.success) { alert("套餐保存成功！"); planModalVisible.value = false; fetchPlans(); }
                    } catch(e) { alert("保存失败"); }
                };

                const deletePlan = async (p) => {
                    if(!confirm(`确定要删除套餐 [${p.name}] 吗？\n删除后前端将不再展示。`)) return;
                    try {
                        const data = await fetchAdmin('/api/admin/plans', { method: 'DELETE', body: JSON.stringify({id: p.id}) });
                        if (data.success) { alert("删除成功！"); fetchPlans(); }
                    } catch(e) { alert("删除失败"); }
                };

                const formatDate = (isoString) => {
                    if (!isoString) return '-';
                    const d = new Date(isoString);
                    return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                };

                onMounted(() => { if (adminSecret.value) login(); });

                return {
                    adminSecret, isAuthenticated, currentTab, loading, errorMsg, login, logout,
                    orders, pendingOrdersCount, fetchOrders, approveOrder, rejectOrder, getPlanName,
                    tickets, pendingTicketsCount, fetchTickets, openReplyModal, replyModalVisible, currentTicket, replyMessage, submitReply, deleteTicket, clearTickets,
                    plans, planModalVisible, planForm, fetchPlans, openPlanModal, submitPlan, deletePlan,
                    users, fetchUsers, manualCharge, deleteUser, formatDate
                };
            }
        }).mount('#admin-app');
    </script>
</body>
</html>
